name: fpl_warzone
description: FFW — Fantasy Football Warzone (Android, iOS, Web + Admin)
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  dio: ^5.4.0
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  flutter_inappwebview: ^6.0.0
  intl: ^0.19.0
  image_picker: ^1.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/img/
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: MrDafoe
      fonts:
        - asset: assets/fonts/MrDafoe-Regular.ttf
dependency_overrides:
  # AGP 9 rejects proguard-android.txt in the published 1.1.3; local copy uses proguard-android-optimize.txt.
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android
